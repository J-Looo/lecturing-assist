<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>課堂即時字幕與 AI 視覺牆</title>
  
  <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background-color: #0d0f12; color: #e3e8f0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang TC", "Microsoft JhengHei", sans-serif;
      height: 100vh; display: flex; flex-direction: column; padding: 1.2vw;
      justify-content: space-between; overflow: hidden;
    }

    header {
      display: flex; justify-content: space-between; align-items: center;
      background: #161b22; border: 1px solid #30363d; padding: 0.6vw 1.2vw;
      border-radius: 8px; font-size: 0.85vw; color: #8b949e;
    }
    .stats-val { color: #38bdf8; font-weight: bold; }
    .btn {
      background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
      padding: 0.3vw 0.6vw; border-radius: 4px; cursor: pointer; font-size: 0.85vw;
    }
    .btn:hover { background: #30363d; color: #fff; }

    main { flex: 1; display: flex; flex-direction: column; gap: 1.2vw; margin-top: 1vw; overflow: hidden; }

    #translate-container { flex: 1.3; display: flex; gap: 1vw; position: relative; }

    .trans-box {
      flex: 1; background: #161b22; border: 1px solid #30363d; border-radius: 12px;
      padding: 1.8vw; display: flex; flex-direction: column; position: relative;
      box-shadow: 0 4px 20px rgba(0,0,0,0.3);
    }

    .box-header {
      display: flex; align-items: center; gap: 8px; font-size: 1.1vw;
      font-weight: 600; color: #38bdf8; margin-bottom: 1vw;
      border-bottom: 1px solid #21262d; padding-bottom: 0.5vw;
    }

    .box-content {
      font-size: 3.5vw; font-weight: 700; line-height: 1.25;
      word-break: break-word; flex: 1; display: flex; align-items: center;
    }

    #speech-text { color: #ffffff; text-shadow: 0 0 15px rgba(255,255,255,0.1); }
    #trans-text { color: #facc15; }

    .swap-icon {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      background: #21262d; border: 1px solid #444c56; color: #38bdf8;
      width: 2.8vw; height: 2.8vw; border-radius: 50%; display: flex;
      align-items: center; justify-content: center; font-size: 1.4vw; z-index: 10;
    }

    #qr-card {
      position: absolute; top: 1vw; right: 1vw; background: #161b22;
      border: 1px solid #444c56; border-radius: 8px; padding: 8px;
      display: flex; flex-direction: column; align-items: center; z-index: 50;
    }
    .qr-card-header { width: 100%; display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
    #qr-toggle-btn { background: #21262d; border: 1px solid #30363d; color: #c9d1d9; border-radius: 3px; cursor: pointer; padding: 1px 5px; font-size: 0.7vw; }
    #qr-body { background: #fff; padding: 4px; border-radius: 4px; }

    #summary-section {
      flex: 0.7; background: #082f49; border: 1px solid #0284c7;
      border-radius: 12px; padding: 1.2vw 1.8vw; display: flex;
      flex-direction: column; justify-content: flex-start; overflow-y: auto;
    }

    .summary-title { font-size: 1vw; color: #7dd3fc; margin-bottom: 0.4vw; font-weight: 600; }
    #summary-text { font-size: 1.3vw; font-weight: 500; color: #e0f2fe; line-height: 1.45; white-space: pre-line; }

    .highlight { background: #854d0e; color: #fef08a; padding: 0 4px; border-radius: 4px; }

    /* Modal 樣式 */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background: rgba(13, 15, 18, 0.7); backdrop-filter: blur(8px);
      display: none; justify-content: center; align-items: center; z-index: 1000;
      opacity: 0; transition: opacity 0.25s ease-in-out;
    }
    .modal-overlay.active {
      display: flex; opacity: 1;
    }
    .modal-content {
      background: #161b22; border: 1px solid #30363d; border-radius: 16px;
      width: 90%; max-width: 480px; padding: 2vw; box-shadow: 0 20px 40px rgba(0,0,0,0.6);
      transform: scale(0.9); transition: transform 0.25s cubic-bezier(0.34, 1.56, 0.64, 1);
      display: flex; flex-direction: column; gap: 1.5vw;
    }
    .modal-overlay.active .modal-content {
      transform: scale(1);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid #21262d; padding-bottom: 0.8vw;
    }
    .modal-title {
      font-size: 1.2vw; font-weight: 700; color: #38bdf8;
      display: flex; align-items: center; gap: 8px;
    }
    .modal-close {
      background: none; border: none; color: #8b949e; cursor: pointer; font-size: 1.5vw;
      line-height: 1; transition: color 0.2s;
    }
    .modal-close:hover { color: #f3f4f6; }
    
    .modal-body {
      display: flex; flex-direction: column; gap: 1vw;
    }
    .modal-body p {
      font-size: 0.85vw; color: #8b949e; line-height: 1.5;
    }
    .modal-link {
      color: #38bdf8; text-decoration: none; border-bottom: 1px dashed #38bdf8;
      transition: color 0.2s, border-color 0.2s;
    }
    .modal-link:hover {
      color: #0ea5e9; border-bottom-style: solid;
    }
    .input-field {
      width: 100%; background: #0d0f12; border: 1px solid #30363d;
      border-radius: 8px; padding: 0.8vw 1vw; color: #fff; font-size: 0.9vw;
      outline: none; transition: border-color 0.2s, box-shadow: 0.2s;
    }
    .input-field:focus {
      border-color: #38bdf8;
      box-shadow: 0 0 0 3px rgba(56, 189, 248, 0.15);
    }
    .modal-footer {
      display: flex; justify-content: flex-end; gap: 1vw;
      border-top: 1px solid #21262d; padding-top: 0.8vw;
    }

    /* 翻譯中動畫 loading-dots */
    .loading-dots {
      display: inline-flex; gap: 6px; align-items: center;
    }
    .loading-dots span {
      width: 0.8vw; height: 0.8vw; background-color: #facc15; border-radius: 50%;
      display: inline-block; animation: bounce 1.4s infinite ease-in-out both;
    }
    .loading-dots span:nth-child(1) { animation-delay: -0.32s; }
    .loading-dots span:nth-child(2) { animation-delay: -0.16s; }
    @keyframes bounce {
      0%, 80%, 100% { transform: scale(0); opacity: 0.3; }
      40% { transform: scale(1); opacity: 1; }
    }
  </style>
</head>
<body>

  <header>
    <div>頻道：<span id="room-display" class="stats-val">----</span> | 總字數：<span id="stat-words" class="stats-val">0</span> | 語速：<span id="stat-wpm" class="stats-val">0</span> 字/分</div>
    <div>
      <button class="btn" onclick="openKeyModal()">⚙️ 設定 Gemini 金鑰</button>
      <button class="btn" onclick="importSheetsKeywords()">匯入 Google 試算表關鍵字</button>
      <button class="btn" style="background:#238636; color:#fff;" onclick="downloadTranscript()">下載逐字稿</button>
    </div>
  </header>

  <main>
    <section id="translate-container">
      <div id="qr-card">
        <div class="qr-card-header">
          <span style="font-size:0.7vw; color:#8b949e;">手機掃碼</span>
          <button id="qr-toggle-btn" onclick="toggleQR()">[-]</button>
        </div>
        <div id="qr-body"><div id="qrcode"></div></div>
      </div>

      <div class="swap-icon">⇄</div>

      <div class="trans-box">
        <div class="box-header">
          <span>🎤 語音輸入</span>
          <span id="source-lang-label" style="font-size:0.8vw; color:#8b949e; margin-left:auto;">(英文)</span>
        </div>
        <div id="speech-text" class="box-content">等待語音輸入...</div>
      </div>

      <div class="trans-box" style="background: #111827;">
        <div class="box-header" style="color: #facc15;">
          <span>🌐 即時校正與翻譯</span>
          <span id="target-lang-label" style="font-size:0.8vw; color:#8b949e; margin-left:auto;">(繁體中文)</span>
        </div>
        <div id="trans-text" class="box-content">等待翻譯服務串接...</div>
      </div>
    </section>

    <section id="summary-section">
      <div class="summary-title">🤖 即時課堂話題摘要</div>
      <div id="summary-text">等待摘要服務串接...</div>
    </section>
  </main>

  <!-- API 金鑰設定 Modal -->
  <div id="key-modal" class="modal-overlay" onclick="closeKeyModalOnOuterClick(event)">
    <div class="modal-content">
      <div class="modal-header">
        <div class="modal-title">⚙️ 設定 Gemini API 金鑰</div>
        <button class="modal-close" onclick="closeKeyModal()">×</button>
      </div>
      <div class="modal-body">
        <p>請輸入您的 Gemini API 金鑰以啟用實時翻譯與摘要功能。金鑰僅儲存在您的瀏覽器本地 (localStorage)，不會上傳至任何伺服器。</p>
        <p>若您還沒有金鑰，可以至 <a href="https://aistudio.google.com/" target="_blank" class="modal-link">Google AI Studio</a> 免費申請。</p>
        <input type="password" id="gemini-key-input" class="input-field" placeholder="請輸入 AI Studio API Key...">
      </div>
      <div class="modal-footer">
        <button class="btn" onclick="closeKeyModal()">取消</button>
        <button class="btn" style="background: #0284c7; color: #fff; border-color: #0284c7;" onclick="saveGeminiKey()">儲存</button>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://test-speaker-cb3f5-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    let roomId = urlParams.get('room') || Math.floor(1000 + Math.random() * 9000).toString();
    document.getElementById('room-display').innerText = roomId;

    const baseUrl = window.location.href.substring(0, window.location.href.lastIndexOf('/'));
    const qrcodeContainer = document.getElementById("qrcode");
    qrcodeContainer.innerHTML = "";
    new QRCode(qrcodeContainer, { text: `${baseUrl}/speaker.html?room=${roomId}`, width: 100, height: 100 });

    function toggleQR() {
      const qrBody = document.getElementById('qr-body');
      const btn = document.getElementById('qr-toggle-btn');
      if (qrBody.style.display === 'none') {
        qrBody.style.display = 'block';
        btn.innerText = '[-]';
      } else {
        qrBody.style.display = 'none';
        btn.innerText = '[+]';
      }
    }

    let customKeywords = [];
    function applyHighlights(text) {
      if(!text) return '';
      let result = text;
      customKeywords.forEach(kw => {
        if(kw.trim()){
          const reg = new RegExp(kw.trim(), 'gi');
          result = result.replace(reg, match => `<span class="highlight">${match}</span>`);
        }
      });
      return result;
    }

    const speechBox = document.getElementById('speech-text');
    const transBox = document.getElementById('trans-text');
    const summaryBox = document.getElementById('summary-text');

    // --- Gemini API & 金鑰管理邏輯 ---
    function openKeyModal() {
      const modal = document.getElementById('key-modal');
      const input = document.getElementById('gemini-key-input');
      input.value = localStorage.getItem('gemini_api_key') || '';
      modal.style.display = 'flex';
      setTimeout(() => modal.classList.add('active'), 10);
    }

    function closeKeyModal() {
      const modal = document.getElementById('key-modal');
      modal.classList.remove('active');
      setTimeout(() => modal.style.display = 'none', 250);
    }

    function closeKeyModalOnOuterClick(e) {
      if (e.target.id === 'key-modal') {
        closeKeyModal();
      }
    }

    function saveGeminiKey() {
      const val = document.getElementById('gemini-key-input').value.trim();
      if (val) {
        localStorage.setItem('gemini_api_key', val);
        alert('Gemini API 金鑰儲存成功！');
      } else {
        localStorage.removeItem('gemini_api_key');
        alert('已清除 Gemini API 金鑰。');
      }
      closeKeyModal();
      checkKeyStatus();
    }

    function getLangCode(lang) {
      if (!lang) return '';
      const l = lang.toLowerCase().trim();
      if (l.includes('zh-tw') || l.includes('繁體中文') || l.includes('traditional') || l.includes('中文 / 中英夾雜') || l.includes('中文')) return 'zh-TW';
      if (l.includes('zh-cn') || l.includes('简体中文') || l.includes('simplified')) return 'zh-CN';
      if (l.includes('en') || l.includes('英文') || l.includes('english')) return 'en';
      if (l.includes('ja') || l.includes('日') || l.includes('japanese')) return 'ja';
      if (l.includes('ko') || l.includes('韓') || l.includes('korean')) return 'ko';
      if (l.includes('es') || l.includes('西') || l.includes('spanish')) return 'es';
      if (l.includes('fr') || l.includes('法') || l.includes('french')) return 'fr';
      if (l.includes('de') || l.includes('德') || l.includes('german')) return 'de';
      return l;
    }

    // 預設 Gemini API 金鑰（留空，由使用者點擊右上角手動設定）
    const DEFAULT_GEMINI_KEY = "";

    function getGeminiKey() {
      return localStorage.getItem('gemini_api_key') || DEFAULT_GEMINI_KEY;
    }

    function checkKeyStatus() {
      const key = getGeminiKey();
      
      // 翻譯功能目前使用 Google 翻譯網頁版免金鑰 API，不需要金鑰提示
      if (transBox.innerText === '等待翻譯服務串接...' || transBox.innerText.includes('請點擊右上角')) {
        transBox.innerText = '等待語音輸入...';
      }
      
      if (!key) {
        if (summaryBox.innerText === '等待摘要服務串接...') {
          summaryBox.innerHTML = '<span style="color:#8b949e; font-size:1.4vw;">請點擊右上角「⚙️ 設定 Gemini 金鑰」以啟動話題摘要</span>';
        }
      } else {
        if (summaryBox.innerText === '等待摘要服務串接...' || summaryBox.innerText.includes('請點擊右上角')) {
          summaryBox.innerText = '等待語音輸入以產生話題摘要...';
        }
      }
    }

    // Debounce 防抖動函數
    function debounce(func, delay) {
      let timer;
      return function (...args) {
        clearTimeout(timer);
        timer = setTimeout(() => func.apply(this, args), delay);
      };
    }

    let lastTranslatedText = '';

    // 呼叫 Google 翻譯免金鑰 API 進行翻譯
    async function translateText(text, sourceLang, targetLangName) {
      const cleanText = text.trim();
      if (!cleanText || cleanText === lastTranslatedText) return;

      // 顯示翻譯中動畫
      transBox.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span><span style="font-size: 1vw; margin-left: 8px; color: #8b949e;">翻譯中...</span></div>';

      try {
        const sourceLangCode = getLangCode(sourceLang) || 'auto';
        const targetLangCode = getLangCode(targetLangName) || 'zh-TW';
        
        const url = `https://translate.googleapis.com/translate_a/single?client=gtx&sl=${sourceLangCode}&tl=${targetLangCode}&dt=t&q=${encodeURIComponent(cleanText)}`;

        const response = await fetch(url);
        if (!response.ok) {
          throw new Error(`Google 翻譯 API 錯誤: ${response.status}`);
        }

        const data = await response.json();
        let translated = '';
        if (data && data[0]) {
          data[0].forEach(item => {
            if (item[0]) {
              translated += item[0];
            }
          });
        }

        if (translated) {
          lastTranslatedText = cleanText;
          transBox.innerText = translated;
        } else {
          transBox.innerText = '翻譯結果為空';
        }
      } catch (err) {
        console.error('Translation failed:', err);
        transBox.innerHTML = `<span style="color:#ef4444; font-size:1.5vw;">翻譯失敗: ${err.message}</span>`;
      }
    }

    // 建立防抖動版本的翻譯函數
    const debouncedTranslate = debounce((text, sourceLang, targetLangName) => {
      translateText(text, sourceLang, targetLangName);
    }, 600);

    // 呼叫 Gemini API 產生課堂摘要
    async function generateSummary() {
      const apiKey = getGeminiKey();
      if (!apiKey) return;
      if (fullTranscriptList.length === 0) return;

      // 顯示摘要中動畫
      summaryBox.innerHTML = '<div class="loading-dots"><span></span><span></span><span></span><span style="font-size: 1vw; margin-left: 8px; color: #7dd3fc;">AI 正在彙整摘要中...</span></div>';

      try {
        const url = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`;
        const transcriptText = fullTranscriptList.join('\n');

        const response = await fetch(url, {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json'
          },
          body: JSON.stringify({
            contents: [{
              parts: [{
                text: `You are an AI classroom teaching assistant. Based on the following transcript history of the lecture so far, generate a concise, bullet-pointed summary of the main topics discussed. 
Requirements:
1. Write in Traditional Chinese (繁體中文).
2. List 2 to 3 core topics or key points.
3. Keep each bullet point brief and clear (one sentence per bullet point).
4. Use standard bullet character "•" for each point.
5. Do not include any preamble, explanations, introduction, markdown headers, or footnotes. Just return the raw bulleted text list.

Lecture transcript history:
${transcriptText}`
              }]
            }],
            generationConfig: {
              temperature: 0.3,
              maxOutputTokens: 800
            }
          })
        });

        if (!response.ok) {
          throw new Error(`API 錯誤: ${response.status}`);
        }

        const data = await response.json();
        const summary = data.candidates?.[0]?.content?.parts?.[0]?.text?.trim();

        if (summary) {
          summaryBox.innerText = summary;
        } else {
          summaryBox.innerText = '摘要結果為空';
        }
      } catch (err) {
        console.error('Summary generation failed:', err);
        summaryBox.innerHTML = `<span style="color:#ef4444; font-size:1.2vw;">無法產生摘要: ${err.message}</span>`;
      }
    }

    // 建立防抖動版本的摘要生成函數 (暫停說話 3 秒後觸發)
    const debouncedGenerateSummary = debounce(() => {
      generateSummary();
    }, 3000);

    // --- Firebase 資料監聽與原有功能 ---

    // 監聽 Firebase 實時語音輸入
    db.ref(`rooms/${roomId}/speech_live`).on('value', (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.text) return;

      speechBox.innerHTML = applyHighlights(data.text);

      let sourceLangVal = '';
      let targetLangNameVal = '';

      if (data.sourceLang) {
        document.getElementById('source-lang-label').innerText = `(${data.sourceLang})`;
        sourceLangVal = data.sourceLang;
      }
      if (data.targetLangName) {
        document.getElementById('target-lang-label').innerText = `(${data.targetLangName})`;
        targetLangNameVal = data.targetLangName;
      }

      // 觸發翻譯（使用免費的 Google 翻譯，無需金鑰）
      debouncedTranslate(data.text, sourceLangVal, targetLangNameVal);
    });

    let fullTranscriptList = [];

    // 監聽逐字稿歷史紀錄
    db.ref(`rooms/${roomId}/speech_history`).on('child_added', (snapshot) => {
      const data = snapshot.val();
      if (!data || !data.text) return;

      fullTranscriptList.push(data.text);
      updateStats(data.text);

      // 觸發 AI 話題摘要功能
      const key = getGeminiKey();
      if (key) {
        debouncedGenerateSummary();
      } else {
        checkKeyStatus();
      }
    });

    let totalWordCount = 0;
    let startTime = Date.now();
    function updateStats(text) {
      totalWordCount += text.trim().length;
      const minutes = (Date.now() - startTime) / 60000;
      document.getElementById('stat-words').innerText = totalWordCount;
      document.getElementById('stat-wpm').innerText = minutes > 0 ? Math.round(totalWordCount / minutes) : 0;
    }

    function importSheetsKeywords() {
      const url = prompt("請貼上 Google 試算表公開發布的 CSV 網址：");
      if (url) {
        fetch(url).then(res => res.text()).then(data => {
          customKeywords = data.split(/\r?\n/).flatMap(row => row.split(','));
          alert(`成功匯入 ${customKeywords.length} 個關鍵字！`);
        });
      }
    }

    function downloadTranscript() {
      if (fullTranscriptList.length === 0) return alert("目前尚無講話紀錄！");
      const text = `--- 課堂逐字稿 (${roomId}) ---\n\n` + fullTranscriptList.join('\n');
      const blob = new Blob([text], { type: 'text/plain;charset=utf-8' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `課堂逐字稿_${roomId}.txt`;
      a.click();
    }

    // 初始化檢查金鑰狀態
    window.addEventListener('DOMContentLoaded', checkKeyStatus);
  </script>
</body>
</html>
