<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>講者麥克風控制台</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d1117; color: #f0f6fc; padding: 15px;
      display: flex; flex-direction: column; align-items: center;
    }
    .panel {
      width: 100%; max-width: 400px; background: #161b22; border: 1px solid #30363d;
      border-radius: 10px; padding: 15px; margin-bottom: 15px;
    }
    .setting-row { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
    select {
      padding: 8px; border-radius: 6px; border: 1px solid #30363d; background: #21262d; color: #fff;
    }
    #toggleBtn {
      width: 100%; padding: 18px; font-size: 1.2rem; font-weight: bold; border-radius: 12px;
      background: #238636; color: #fff; border: none; cursor: pointer; margin-bottom: 15px;
    }
    #toggleBtn.speaking { background: #da3633; }
    
    /* 手機端即時除錯視窗 */
    #debug-log {
      width: 100%; max-width: 400px; height: 120px; background: #000; color: #38bdf8;
      border: 1px solid #30363d; border-radius: 8px; padding: 10px; font-family: monospace;
      font-size: 0.75rem; overflow-y: auto; white-space: pre-wrap;
    }
  </style>
</head>
<body>

  <h2 style="margin-bottom:5px;">🎤 講者控制台</h2>
  <div style="color:#58a6ff; margin-bottom:15px;">房間頻道：<span id="room-id">----</span></div>

  <div class="panel">
    <div class="setting-row">
      <label>識別語言：</label>
      <select id="langSelect">
        <option value="cmn-Hant-TW">中文 / 中英夾雜</option>
        <option value="en-US">English (英語)</option>
      </select>
    </div>

    <div class="setting-row">
      <label>即時翻譯：</label>
      <input type="checkbox" id="translateToggle">
    </div>

    <div class="setting-row" id="transTargetRow" style="display:none;">
      <label>目標語言：</label>
      <select id="targetLangSelect">
        <option value="en">翻譯為 英文</option>
        <option value="zh-TW">翻譯為 中文</option>
      </select>
    </div>
  </div>

  <button id="toggleBtn">開啟麥克風收音</button>

  <!-- 除錯訊息面板 -->
  <div id="debug-log">Log: 頁面已載入，等待操作...</div>

  <script>
    // 簡單日誌紀錄函數
    function log(msg) {
      const logBox = document.getElementById('debug-log');
      logBox.innerText += `\n[${new Date().toLocaleTimeString()}] ${msg}`;
      logBox.scrollTop = logBox.scrollHeight;
    }

    // 1. 初始化 Firebase (請確認這個 URL 是否為你的真實資料庫網址)
    const firebaseConfig = {
      databaseURL: "https://test-speaker-cb3f5-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    
    try {
      firebase.initializeApp(firebaseConfig);
      log("Firebase 初始化成功！");
    } catch(e) {
      log("Firebase 初始化失敗: " + e.message);
    }
    const db = firebase.database();

    // 2. 解析房間號碼
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    document.getElementById('room-id').innerText = roomId;
    log("當前房間號碼：" + roomId);

    const translateToggle = document.getElementById('translateToggle');
    const transTargetRow = document.getElementById('transTargetRow');
    translateToggle.onchange = () => {
      transTargetRow.style.display = translateToggle.checked ? 'flex' : 'none';
    };

    // 3. 語音辨識邏輯 (採用最相容手機端的寫法)
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (!SpeechRecognition) {
      log("❌ 警告：此手機瀏覽器不支援語音辨識！(請改用 Safari 或 Chrome)");
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isListening = true;
        log("🎤 麥克風已啟動，請開始說話...");
        document.getElementById('toggleBtn').innerText = "停止收音";
        document.getElementById('toggleBtn').classList.add('speaking');
      };

      recognition.onerror = (event) => {
        log("❌ 語音辨識錯誤: " + event.error);
      };

      recognition.onend = () => {
        log("麥克風連線斷開...");
        if (isListening) {
          log("嘗試自動重新連線...");
          try { recognition.start(); } catch(e) {}
        } else {
          document.getElementById('toggleBtn').innerText = "開啟麥克風收音";
          document.getElementById('toggleBtn').classList.remove('speaking');
        }
      };

      recognition.onresult = async (event) => {
        let interimText = '';
        let finalText = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
          else interimText += event.results[i][0].transcript;
        }

        const currentText = finalText || interimText;
        if (!currentText.trim()) return;

        log("辨識文字: " + currentText);

        // 核心修改處：將翻譯開關與目標語言一併送到 Firebase，讓電視端 (index.html) 呼叫 Gemini 進行高品質翻譯
        db.ref(`rooms/${roomId}/speech_live`).set({
          text: currentText,
          needTranslate: translateToggle.checked,
          targetLang: document.getElementById('targetLangSelect').value,
          timestamp: Date.now()
        }).then(() => {
          log("已成功發送至雲端！");
        }).catch(err => {
          log("❌ Firebase 寫入失敗: " + err.message);
        });

        if (finalText) {
          db.ref(`rooms/${roomId}/speech_history`).push({
            text: finalText,
            timestamp: Date.now()
          });
        }
      };
    }

    // 按鈕點擊事件
    document.getElementById('toggleBtn').onclick = () => {
      if (!recognition) return alert("您的瀏覽器不支援語音辨識！");
      
      if (!isListening) {
        recognition.lang = document.getElementById('langSelect').value;
        try {
          recognition.start();
        } catch(e) {
          log("啟動失敗: " + e.message);
        }
      } else {
        isListening = false;
        recognition.stop();
        log("使用者手動停止收音");
      }
    };
  </script>
</body>
</html>
