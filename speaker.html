<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>講者控制台</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d1117; color: #f0f6fc; padding: 15px;
      display: flex; flex-direction: column; align-items: center;
    }
    
    /* Google 翻譯頂部語言切換列 */
    .trans-header {
      width: 100%; max-width: 400px; background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 10px 15px; display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 15px;
    }
    select {
      background: transparent; color: #38bdf8; border: none; font-size: 1rem;
      font-weight: bold; outline: none; cursor: pointer;
    }
    .swap-btn {
      background: #21262d; border: 1px solid #30363d; color: #8b949e;
      width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* 麥克風與語音即時顯示面板 */
    .mic-panel {
      width: 100%; max-width: 400px; background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center;
      gap: 15px; margin-bottom: 15px;
    }

    #micBtn {
      width: 70px; height: 70px; border-radius: 50%; background: #238636; border: none;
      color: #fff; font-size: 1.8rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
    }
    #micBtn.speaking { background: #da3633; box-shadow: 0 4px 12px rgba(218, 54, 51, 0.5); }

    .live-preview {
      width: 100%; min-height: 80px; background: #0d1117; border: 1px solid #21262d;
      border-radius: 8px; padding: 10px; font-size: 1rem; color: #e3e8f0; word-break: break-word;
    }

    /* 翻譯開關列 */
    .toggle-row {
      width: 100%; max-width: 400px; display: flex; justify-content: space-between;
      align-items: center; background: #161b22; border: 1px solid #30363d;
      border-radius: 8px; padding: 12px 15px; font-size: 0.95rem;
    }
  </style>
</head>
<body>

  <h3 style="margin-bottom: 15px;">🎤 講者控制台 (房間: <span id="room-id">----</span>)</h3>

  <!-- 1. Google 翻譯風格左右對調選單 -->
  <div class="trans-header">
    <select id="sourceLangSelect">
      <option value="cmn-Hant-TW" data-name="中文 / 中英夾雜">中文 / 中英夾雜</option>
      <option value="en-US" data-name="英文">英文</option>
      <option value="ja-JP" data-name="日文">日文</option>
    </select>

    <button class="swap-btn" onclick="swapLanguages()">⇄</button>

    <select id="targetLangSelect">
      <option value="en" data-name="英文">英文</option>
      <option value="zh-TW" data-name="繁體中文">繁體中文</option>
      <option value="ja" data-name="日文">日文</option>
    </select>
  </div>

  <!-- 2. 翻譯開關 -->
  <div class="toggle-row" style="margin-bottom: 15px;">
    <span>啟用 Gemini 即時對照翻譯</span>
    <input type="checkbox" id="translateToggle" checked style="width:20px; height:20px;">
  </div>

  <!-- 3. 大顆 Google 麥克風按鈕區 -->
  <div class="mic-panel">
    <button id="micBtn">🎤</button>
    <div id="statusText" style="font-size:0.85rem; color:#8b949e;">點擊麥克風開始收音</div>
    <div class="live-preview" id="liveText">即時辨識文字將顯示於此...</div>
  </div>

  <script>
    const firebaseConfig = {
      databaseURL: "https://test-speaker-cb3f5-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    document.getElementById('room-id').innerText = roomId;

    // 對調語言選單邏輯
    function swapLanguages() {
      const srcSelect = document.getElementById('sourceLangSelect');
      const tgtSelect = document.getElementById('targetLangSelect');
      const tempVal = srcSelect.selectedIndex;
      
      // 簡易切換範例 (中文 <-> 英文)
      if (srcSelect.value === 'cmn-Hant-TW') {
        srcSelect.value = 'en-US';
        tgtSelect.value = 'zh-TW';
      } else {
        srcSelect.value = 'cmn-Hant-TW';
        tgtSelect.value = 'en';
      }
    }

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('statusText').innerText = "🎤 收音中，請說話...";
        document.getElementById('micBtn').classList.add('speaking');
      };

      recognition.onend = () => {
        if (isListening) recognition.start();
        else {
          document.getElementById('statusText').innerText = "已停止收音";
          document.getElementById('micBtn').classList.remove('speaking');
        }
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let finalText = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
          else interimText += event.results[i][0].transcript;
        }

        const currentText = finalText || interimText;
        if (!currentText.trim()) return;

        document.getElementById('liveText').innerText = currentText;

        const srcOpt = document.getElementById('sourceLangSelect').selectedOptions[0];
        const tgtOpt = document.getElementById('targetLangSelect').selectedOptions[0];

        // 將文字與語言方向推送到 Firebase
        db.ref(`rooms/${roomId}/speech_live`).set({
          text: currentText,
          needTranslate: document.getElementById('translateToggle').checked,
          sourceLang: srcOpt.getAttribute('data-name'),
          targetLangName: tgtOpt.getAttribute('data-name'),
          timestamp: Date.now()
        });

        if (finalText) {
          db.ref(`rooms/${roomId}/speech_history`).push({
            text: finalText,
            timestamp: Date.now()
          });
        }
      };
    }

    document.getElementById('micBtn').onclick = () => {
      if (!recognition) return alert("瀏覽器不支援語音辨識！");
      if (!isListening) {
        recognition.lang = document.getElementById('sourceLangSelect').value;
        recognition.start();
      } else {
        isListening = false;
        recognition.stop();
      }
    };
  </script>
</body>
</html>
