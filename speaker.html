<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>講者控制台</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #0d1117; color: #f0f6fc; padding: 15px;
      display: flex; flex-direction: column; align-items: center;
    }
    
    /* Google 翻譯風格語言選擇列 */
    .trans-header {
      width: 100%; max-width: 400px; background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 10px 15px; display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 15px;
    }
    select {
      background: transparent; color: #38bdf8; border: none; font-size: 1rem;
      font-weight: bold; outline: none; cursor: pointer;
    }
    .swap-btn {
      background: #21262d; border: 1px solid #30363d; color: #8b949e;
      width: 36px; height: 36px; border-radius: 50%; font-size: 1.2rem;
      display: flex; align-items: center; justify-content: center; cursor: pointer;
    }

    /* 麥克風面板與預覽區 */
    .mic-panel {
      width: 100%; max-width: 400px; background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 20px; display: flex; flex-direction: column; align-items: center;
      gap: 15px; margin-bottom: 15px;
    }

    #micBtn {
      width: 70px; height: 70px; border-radius: 50%; background: #238636; border: none;
      color: #fff; font-size: 1.8rem; display: flex; align-items: center; justify-content: center;
      cursor: pointer; box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
      transition: all 0.2s ease;
    }
    #micBtn.speaking { background: #da3633; box-shadow: 0 4px 12px rgba(218, 54, 51, 0.5); }
    #micBtn.processing { background: #facc15; box-shadow: 0 4px 12px rgba(250, 204, 21, 0.5); animation: pulse 1.5s infinite; }
    
    @keyframes pulse {
      0% { opacity: 0.6; }
      50% { opacity: 1; }
      100% { opacity: 0.6; }
    }

    .live-preview {
      width: 100%; min-height: 80px; background: #0d1117; border: 1px solid #21262d;
      border-radius: 8px; padding: 10px; font-size: 1rem; color: #e3e8f0; word-break: break-word;
    }
    /* 教師遠端操控面板樣式 */
    .control-panel {
      width: 100%; max-width: 400px; background: #161b22; border: 1px solid #30363d;
      border-radius: 12px; padding: 20px; display: flex; flex-direction: column;
      gap: 15px; margin-bottom: 25px;
    }
    .control-row {
      display: flex; align-items: center; justify-content: space-between; gap: 10px;
    }
    .control-btn {
      background: #21262d; border: 1px solid #30363d; color: #c9d1d9;
      padding: 8px 16px; border-radius: 6px; font-size: 0.9rem; font-weight: bold;
      cursor: pointer; transition: all 0.2s ease; outline: none;
    }
    .control-btn:active {
      transform: scale(0.95);
    }
  </style>
</head>
<body>

  <h3 style="margin-bottom: 15px;">🎤 講者控制台 (頻道: <span id="room-id">----</span>)</h3>

  <!-- 1. 左右語言選單 -->
  <div class="trans-header">
    <select id="sourceLangSelect">
      <option value="cmn-Hant-TW" data-name="中文 / 中英夾雜">中文 / 中英夾雜</option>
      <option value="en-US" data-name="英文">英文</option>
      <option value="ja-JP" data-name="日文">日文</option>
    </select>

    <button class="swap-btn" onclick="swapLanguages()">⇄</button>

    <select id="targetLangSelect">
      <option value="en" data-name="英文">英文</option>
      <option value="zh-TW" data-name="繁體中文">繁體中文</option>
      <option value="ja" data-name="日文">日文</option>
    </select>
  </div>

  <!-- 辨識模式切換 -->
  <div class="trans-header" style="margin-bottom: 15px; justify-content: space-around;">
    <span style="font-size: 0.9rem; font-weight: bold; color: #8b949e;">辨識模式：</span>
    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; color: #38bdf8;">
      <input type="radio" name="recognitionMode" value="standard" checked onclick="switchMode('standard')"> 標準 (內建)
    </label>
    <label style="display: flex; align-items: center; gap: 8px; cursor: pointer; font-size: 0.95rem; font-weight: 600; color: #facc15;">
      <input type="radio" name="recognitionMode" value="whisper" onclick="switchMode('whisper')"> AI 高精準 (Whisper)
    </label>
  </div>

  <!-- 2. 收音按鈕與即時文字顯示卡片 -->
  <div class="mic-panel">
    <button id="micBtn">🎤</button>
    <div id="statusText" style="font-size:0.85rem; color:#8b949e;">點擊麥克風開始收音</div>
    <div class="live-preview" id="liveText">即時辨識文字將顯示於此...</div>
  </div>

  <!-- 3. 教師遠端操控面板 -->
  <div class="control-panel">
    <h4 style="color: #38bdf8; border-bottom: 1px solid #21262d; padding-bottom: 8px; font-size: 1rem; margin-bottom: 5px;">🛠️ 課堂遠端功能</h4>
    
    <!-- 播放鈴聲 -->
    <div class="control-row">
      <div>
        <div style="font-size: 0.95rem; font-weight: bold;">🔔 播放注意力鈴聲</div>
        <div style="font-size: 0.75rem; color: #8b949e; margin-top: 2px;">在電腦端播放空氣喇叭音效</div>
      </div>
      <button class="control-btn" id="bellBtn" onclick="triggerBell()" style="background: #238636; color: #fff;">播放</button>
    </div>

    <!-- 噪音偵測 -->
    <div class="control-row" style="border-top: 1px solid #21262d; padding-top: 15px;">
      <div>
        <div style="font-size: 0.95rem; font-weight: bold;">🔊 噪音監測模式</div>
        <div style="font-size: 0.75rem; color: #8b949e; margin-top: 2px;">超過 75 分貝時電腦螢幕閃爍警示</div>
      </div>
      <button class="control-btn" id="noiseBtn" onclick="toggleNoiseMonitor()">開啟</button>
    </div>
    
    <!-- 實時分貝顯示 (隱藏/開啟時顯示) -->
    <div id="decibelMeter" style="display: none; align-items: center; gap: 10px; font-size: 0.85rem; color: #8b949e; margin-top: 5px;">
      <span>音量：</span>
      <div style="flex: 1; height: 10px; background: #0d1117; border-radius: 5px; overflow: hidden; position: relative;">
        <div id="decibelBar" style="width: 0%; height: 100%; background: #238636; transition: width 0.1s ease;"></div>
      </div>
      <span id="decibelVal">0 dB</span>
    </div>

    <!-- 詢問 AI 問題 -->
    <div style="display: flex; flex-direction: column; gap: 10px; border-top: 1px solid #21262d; padding-top: 15px;">
      <div class="control-row">
        <div>
          <div style="font-size: 0.95rem; font-weight: bold;">🤖 語音詢問 AI</div>
          <div style="font-size: 0.75rem; color: #8b949e; margin-top: 2px;">向 Groq 大模型發問，答案投在電腦螢幕</div>
        </div>
        <button class="control-btn" id="aiBtn" onclick="toggleAIQuestion()">發問</button>
      </div>
      <div id="aiStatusBox" style="display: none; flex-direction: column; gap: 8px; background: #0d1117; border: 1px solid #21262d; border-radius: 8px; padding: 10px; font-size: 0.85rem;">
        <div id="aiStatusText" style="color: #8b949e;">請對麥克風說出您的問題...</div>
        <div id="aiQuestionPreview" style="color: #e3e8f0; font-weight: bold; word-break: break-word;"></div>
        <div id="aiAnswerPreview" style="color: #facc15; word-break: break-word; display: none;"></div>
        <button class="control-btn" id="aiCloseBtn" onclick="closeAIQuestion()" style="display: none; background: #da3633; border: none; color: #fff; padding: 6px; border-radius: 4px; font-size: 0.8rem; cursor: pointer; align-self: flex-end;">結束對話</button>
      </div>
    </div>
  </div>

  <script>
    // 1. 初始化 Firebase
    const firebaseConfig = {
      databaseURL: "https://test-speaker-cb3f5-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. 解析頻道房間號碼
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    document.getElementById('room-id').innerText = roomId;

    // Web Speech API 初始化與變數
    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;
    let isChangingLang = false; // 關鍵：防止切換語言時 onend 與 setTimeout 衝突的保護旗標

    // Whisper 辨識相關變數
    let currentMode = 'standard'; // 'standard' or 'whisper'
    let mediaRecorder = null;
    let audioChunks = [];
    let audioContext = null;
    let analyser = null;
    let microphoneNode = null;
    let javascriptNode = null;
    let audioStream = null;

    let isWhisperListening = false;
    let silenceTimer = null;
    const SILENCE_THRESHOLD = 15; // 音量平均值小於此值判定為靜音
    const SILENCE_DURATION = 1200; // 靜音持續 1.2 秒則自動斷句並送出

    // Groq 金鑰同步監聽
    let groqApiKey = '';
    db.ref(`rooms/${roomId}/groq_key`).on('value', (snapshot) => {
      groqApiKey = snapshot.val() || '';
      checkWhisperStatus();
    });

    function checkWhisperStatus() {
      const statusText = document.getElementById('statusText');
      if (currentMode === 'whisper') {
        if (!groqApiKey) {
          statusText.innerHTML = '<span style="color: #da3633; font-weight: bold;">請先在檢視端網頁設定 Groq 金鑰！</span>';
        } else {
          statusText.innerText = isWhisperListening ? '🎤 Whisper 聆聽中...請說話' : '點擊麥克風開始 AI 語意收音';
        }
      }
    }

    // 3. 語言切換對調邏輯
    function swapLanguages() {
      const srcSelect = document.getElementById('sourceLangSelect');
      const tgtSelect = document.getElementById('targetLangSelect');
      
      const oldSrc = srcSelect.value;
      if (oldSrc === 'cmn-Hant-TW') {
        srcSelect.value = 'en-US';
        tgtSelect.value = 'zh-TW';
      } else {
        srcSelect.value = 'cmn-Hant-TW';
        tgtSelect.value = 'en';
      }
      
      syncLanguageToFirebase();

      if (currentMode === 'standard' && isListening && recognition) {
        restartRecognition();
      }
    }

    // 4. 同步當前選單語言標籤至 Firebase
    function syncLanguageToFirebase() {
      const srcOpt = document.getElementById('sourceLangSelect').selectedOptions[0];
      const tgtOpt = document.getElementById('targetLangSelect').selectedOptions[0];

      db.ref(`rooms/${roomId}/speech_live`).update({
        sourceLang: srcOpt ? srcOpt.getAttribute('data-name') : '',
        targetLangName: tgtOpt ? tgtOpt.getAttribute('data-name') : ''
      });
    }

    // 5. 模式切換邏輯
    function switchMode(mode) {
      if (currentMode === mode) return;

      // 停止目前運行的辨識/錄音
      if (isListening && recognition) {
        isListening = false;
        recognition.stop();
      }
      if (isWhisperListening) {
        stopWhisper();
      }

      currentMode = mode;

      // 重設 UI 與狀態
      const micBtn = document.getElementById('micBtn');
      micBtn.className = '';
      micBtn.innerText = '🎤';
      document.getElementById('liveText').innerText = '即時辨識文字將顯示於此...';
      
      if (mode === 'standard') {
        document.getElementById('statusText').innerText = '點擊麥克風開始收音';
      } else {
        checkWhisperStatus();
      }
    }

    // 6. 語音辨識 (Web Speech API) 初始化
    if (SpeechRecognition) {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.maxAlternatives = 1;

      recognition.onstart = () => {
        isListening = true;
        document.getElementById('statusText').innerText = "🎤 已開始收音 (請稍停 0.2 秒後開口)";
        document.getElementById('micBtn').classList.add('speaking');
      };

      recognition.onend = () => {
        // 如果正在切換語言中，忽視自動重連，交由 restartRecognition 處理
        if (isChangingLang) return;

        // 如果使用者沒有點按手動停止，因斷句中斷時自動重連
        if (isListening) {
          try { 
            recognition.start(); 
          } catch(e) {
            console.warn("自動重連失敗:", e);
          }
        } else {
          document.getElementById('statusText').innerText = "已停止收音";
          document.getElementById('micBtn').classList.remove('speaking');
        }
      };

      recognition.onresult = (event) => {
        let interimText = '';
        let finalText = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) finalText += event.results[i][0].transcript;
          else interimText += event.results[i][0].transcript;
        }

        const currentText = finalText || interimText;
        if (!currentText.trim()) return;

        // 本地預覽顯示
        document.getElementById('liveText').innerText = currentText;

        const srcOpt = document.getElementById('sourceLangSelect').selectedOptions[0];
        const tgtOpt = document.getElementById('targetLangSelect').selectedOptions[0];

        // 推送上雲端 Firebase 節點
        db.ref(`rooms/${roomId}/speech_live`).set({
          text: currentText,
          sourceLang: srcOpt ? srcOpt.getAttribute('data-name') : '',
          targetLangName: tgtOpt ? tgtOpt.getAttribute('data-name') : '',
          timestamp: Date.now()
        });

        if (finalText) {
          db.ref(`rooms/${roomId}/speech_history`).push({
            text: finalText,
            timestamp: Date.now()
          });
        }
      };
    }

    // 安全重新啟動辨識 (用於改變語言時強制生效)
    function restartRecognition() {
      if (!recognition) return;
      
      isChangingLang = true; // 開啟旗標，封鎖 onend 的自動重連
      recognition.stop();

      document.getElementById('statusText').innerText = "🔄 正在套用新語言...";

      setTimeout(() => {
        const newLang = document.getElementById('sourceLangSelect').value;
        recognition.lang = newLang; // 指定新語言
        
        syncLanguageToFirebase();

        try {
          recognition.start();
          console.log("語音辨識已順利重啟，新語言為：", newLang);
        } catch(e) {
          console.error("重啟語音辨識失敗：", e);
        } finally {
          isChangingLang = false; // 解除旗標
        }
      }, 350); // 給予 350ms 確保瀏覽器引擎完全釋放
    }

    // 7. Whisper 收音控制邏輯
    async function startWhisper() {
      if (!groqApiKey) {
        alert("請先在檢視端網頁設定 Groq 金鑰！");
        return;
      }
      try {
        // 請求麥克風權限
        audioStream = await navigator.mediaDevices.getUserMedia({ audio: true });
        
        // 初始化 AudioContext 作為 VAD 音量偵測
        audioContext = new (window.AudioContext || window.webkitAudioContext)();
        analyser = audioContext.createAnalyser();
        microphoneNode = audioContext.createMediaStreamSource(audioStream);
        javascriptNode = audioContext.createScriptProcessor(2048, 1, 1);
        
        analyser.smoothingTimeConstant = 0.8;
        analyser.fftSize = 1024;
        
        microphoneNode.connect(analyser);
        analyser.connect(javascriptNode);
        javascriptNode.connect(audioContext.destination);
        
        isWhisperListening = true;
        document.getElementById('statusText').innerText = "🎤 Whisper 聆聽中...請說話";
        const micBtn = document.getElementById('micBtn');
        micBtn.classList.add('speaking');
        micBtn.innerText = '⏺️';
        document.getElementById('liveText').innerText = '正在偵測您的聲音...';
        
        // 開始第一個音訊切片的錄製
        startNewAudioChunk();
        
        // 偵測音量
        javascriptNode.onaudioprocess = () => {
          if (!isWhisperListening) return;
          const array = new Uint8Array(analyser.frequencyBinCount);
          analyser.getByteFrequencyData(array);
          let values = 0;
          const length = array.length;
          for (let i = 0; i < length; i++) {
            values += array[i];
          }
          const average = values / length;
          
          // 如果音量低於門檻，啟動靜音計時器
          if (average < SILENCE_THRESHOLD) {
            if (!silenceTimer) {
              silenceTimer = setTimeout(() => {
                triggerWhisperTranscription();
              }, SILENCE_DURATION);
            }
          } else {
            // 偵測到有聲音，清除計時器
            if (silenceTimer) {
              clearTimeout(silenceTimer);
              silenceTimer = null;
            }
            document.getElementById('statusText').innerText = "🎤 Whisper 偵測到說話中...";
          }
        };
        
      } catch (err) {
        console.error("無法啟動麥克風錄音:", err);
        alert("無法開啟麥克風，請確認權限與連線！\n錯誤: " + err.message);
        stopWhisper();
      }
    }

    function startNewAudioChunk() {
      if (!audioStream) return;
      audioChunks = [];
      mediaRecorder = new MediaRecorder(audioStream, { mimeType: 'audio/webm' });
      
      mediaRecorder.ondataavailable = (event) => {
        if (event.data.size > 0) {
          audioChunks.push(event.data);
        }
      };
      
      mediaRecorder.onstop = async () => {
        const audioBlob = new Blob(audioChunks, { type: 'audio/webm' });
        if (audioBlob.size > 1000 && isWhisperListening) {
          sendToWhisper(audioBlob);
        }
      };
      
      mediaRecorder.start();
    }

    function triggerWhisperTranscription() {
      if (mediaRecorder && mediaRecorder.state === "recording") {
        document.getElementById('statusText').innerText = "⏳ AI 正在辨識此段落...";
        mediaRecorder.stop(); // 停止目前錄音（會觸發 onstop 發送音檔）
        
        // 立刻重啟下一個錄音切片以保持連續收音
        if (isWhisperListening) {
          startNewAudioChunk();
        }
      }
    }

    async function sendToWhisper(audioBlob) {
      if (!groqApiKey) {
        alert("請先在檢視端網頁設定 Groq 金鑰！");
        stopWhisper();
        return;
      }

      const micBtn = document.getElementById('micBtn');
      micBtn.classList.remove('speaking');
      micBtn.classList.add('processing');
      micBtn.innerText = '⏳';

      try {
        const formData = new FormData();
        formData.append('file', audioBlob, 'speech.wav');
        formData.append('model', 'whisper-large-v3');
        formData.append('response_format', 'json');

        const response = await fetch('https://api.groq.com/openai/v1/audio/transcriptions', {
          method: 'POST',
          headers: {
            'Authorization': `Bearer ${groqApiKey}`
          },
          body: formData
        });

        if (!response.ok) {
          throw new Error(`Groq Whisper API 錯誤: ${response.status}`);
        }

        const data = await response.json();
        const resultText = data.text?.trim();

        if (resultText) {
          console.log("Groq Whisper 辨識成果:", resultText);
          document.getElementById('liveText').innerText = resultText;
          
          const srcOpt = document.getElementById('sourceLangSelect').selectedOptions[0];
          const tgtOpt = document.getElementById('targetLangSelect').selectedOptions[0];
          
          // 1. 即時推送雲端 (給翻譯用)
          db.ref(`rooms/${roomId}/speech_live`).set({
            text: resultText,
            sourceLang: srcOpt ? srcOpt.getAttribute('data-name') : '',
            targetLangName: tgtOpt ? tgtOpt.getAttribute('data-name') : '',
            timestamp: Date.now()
          });

          // 2. 推送歷史紀錄 (給摘要用)
          db.ref(`rooms/${roomId}/speech_history`).push({
            text: resultText,
            timestamp: Date.now()
          });
        }
      } catch (err) {
        console.error("Groq Whisper 轉譯失敗:", err);
        document.getElementById('liveText').innerText = "AI 辨識失敗: " + err.message;
      } finally {
        if (isWhisperListening) {
          micBtn.className = 'speaking';
          micBtn.innerText = '⏺️';
          checkWhisperStatus();
        } else {
          micBtn.className = '';
          micBtn.innerText = '🎤';
          document.getElementById('statusText').innerText = "已停止收音";
        }
      }
    }

    function stopWhisper() {
      isWhisperListening = false;
      if (silenceTimer) {
        clearTimeout(silenceTimer);
        silenceTimer = null;
      }

      if (mediaRecorder && mediaRecorder.state === "recording") {
        mediaRecorder.stop();
      }

      // 關閉設備與音訊上下文
      if (audioStream) {
        audioStream.getTracks().forEach(track => track.stop());
        audioStream = null;
      }

      if (javascriptNode) {
        javascriptNode.disconnect();
        javascriptNode = null;
      }
      if (microphoneNode) {
        microphoneNode.disconnect();
        microphoneNode = null;
      }
      if (audioContext) {
        audioContext.close();
        audioContext = null;
      }

      document.getElementById('statusText').innerText = "已停止收音";
      const micBtn = document.getElementById('micBtn');
      micBtn.className = '';
      micBtn.innerText = '🎤';
    }

    // 8. 監聽選單與按鈕事件
    document.getElementById('sourceLangSelect').onchange = () => {
      syncLanguageToFirebase();
      if (currentMode === 'standard' && isListening) {
        restartRecognition();
      }
    };

    document.getElementById('targetLangSelect').onchange = () => {
      syncLanguageToFirebase();
    };

    // 麥克風按鈕按鍵派發
    document.getElementById('micBtn').onclick = () => {
      if (isAIRecording && aiRecognition) {
        aiRecognition.stop();
      }

      if (currentMode === 'standard') {
        if (!recognition) return alert("您的手機瀏覽器不支援語音辨識！");
        
        if (!isListening) {
          recognition.lang = document.getElementById('sourceLangSelect').value;
          syncLanguageToFirebase();
          try {
            recognition.start();
          } catch(e) {
            console.error("啟動失敗", e);
          }
        } else {
          isListening = false;
          recognition.stop();
        }
      } else {
        if (!isWhisperListening) {
          startWhisper();
        } else {
          stopWhisper();
        }
      }
    };

    // --- 1. 遠端播放注意力鈴聲 ---
    function triggerBell() {
      db.ref(`rooms/${roomId}/commands/play_bell`).set(Date.now());
      const btn = document.getElementById('bellBtn');
      if (btn) {
        btn.style.background = '#facc15';
        btn.innerText = '已播放';
        setTimeout(() => {
          btn.style.background = '#238636';
          btn.innerText = '播放';
        }, 1500);
      }
    }

    // --- 2. 手機端分貝監測邏輯 ---
    let noiseInterval = null;
    let noiseAudioContext = null;
    let noiseStream = null;
    let isNoiseMonitoring = false;

    async function toggleNoiseMonitor() {
      const btn = document.getElementById('noiseBtn');
      const meter = document.getElementById('decibelMeter');
      if (!isNoiseMonitoring) {
        try {
          noiseStream = await navigator.mediaDevices.getUserMedia({ audio: true });
          noiseAudioContext = new (window.AudioContext || window.webkitAudioContext)();
          const source = noiseAudioContext.createMediaStreamSource(noiseStream);
          const noiseAnalyser = noiseAudioContext.createAnalyser();
          noiseAnalyser.fftSize = 512;
          source.connect(noiseAnalyser);
          const bufferLength = noiseAnalyser.frequencyBinCount;
          const dataArray = new Uint8Array(bufferLength);

          isNoiseMonitoring = true;
          btn.style.background = '#da3633';
          btn.style.color = '#fff';
          btn.innerText = '關閉';
          meter.style.display = 'flex';

          let lastAlertTime = 0;

          noiseInterval = setInterval(() => {
            noiseAnalyser.getByteFrequencyData(dataArray);
            let sum = 0;
            for (let i = 0; i < bufferLength; i++) {
              sum += dataArray[i];
            }
            const average = sum / bufferLength;
            
            // 將平均音量分數映射到 0~100 %
            const volumeScore = Math.min(Math.round((average / 120) * 100), 100);
            
            // 更新手機端分貝儀 UI
            const bar = document.getElementById('decibelBar');
            const val = document.getElementById('decibelVal');
            if (bar) bar.style.width = volumeScore + '%';
            if (val) val.innerText = volumeScore + ' dB';
            
            if (bar) {
              if (volumeScore > 75) {
                bar.style.background = '#da3633'; // 紅色
              } else if (volumeScore > 50) {
                bar.style.background = '#facc15'; // 黃色
              } else {
                bar.style.background = '#238636'; // 綠色
              }
            }

            // 超過 75 分貝限制即寫入 Firebase
            if (volumeScore > 75) {
              const now = Date.now();
              if (now - lastAlertTime > 1500) {
                lastAlertTime = now;
                db.ref(`rooms/${roomId}/noise_alert`).set({
                  active: true,
                  timestamp: now
                });
              }
            }
          }, 100);
          
        } catch (err) {
          console.error("無法啟動噪音監測:", err);
          alert("啟動監測失敗，請確認麥克風權限！");
          closeNoiseMonitor();
        }
      } else {
        closeNoiseMonitor();
      }
    }

    function closeNoiseMonitor() {
      isNoiseMonitoring = false;
      const btn = document.getElementById('noiseBtn');
      const meter = document.getElementById('decibelMeter');
      if (btn) {
        btn.style.background = '#21262d';
        btn.style.color = '#c9d1d9';
        btn.innerText = '開啟';
      }
      if (meter) meter.style.display = 'none';
      
      if (noiseInterval) {
        clearInterval(noiseInterval);
        noiseInterval = null;
      }
      if (noiseStream) {
        noiseStream.getTracks().forEach(track => track.stop());
        noiseStream = null;
      }
      if (noiseAudioContext) {
        noiseAudioContext.close();
        noiseAudioContext = null;
      }
      db.ref(`rooms/${roomId}/noise_alert`).remove();
    }

    // --- 3. 語音詢問 AI 問題對答邏輯 ---
    let aiRecognition = null;
    let isAIRecording = false;

    function toggleAIQuestion() {
      const btn = document.getElementById('aiBtn');
      const box = document.getElementById('aiStatusBox');
      const text = document.getElementById('aiStatusText');
      const qPreview = document.getElementById('aiQuestionPreview');
      const aPreview = document.getElementById('aiAnswerPreview');
      const closeBtn = document.getElementById('aiCloseBtn');

      if (!isAIRecording) {
        if (!window.webkitSpeechRecognition && !window.SpeechRecognition) {
          return alert("您的手機瀏覽器不支援語音對話功能！");
        }

        // 先暫停一般收音
        if (isListening && recognition) {
          isListening = false;
          recognition.stop();
        }
        if (isWhisperListening) {
          stopWhisper();
        }

        const SpeechRec = window.SpeechRecognition || window.webkitSpeechRecognition;
        aiRecognition = new SpeechRec();
        aiRecognition.continuous = false;
        aiRecognition.interimResults = false;
        aiRecognition.lang = 'zh-TW';

        aiRecognition.onstart = () => {
          isAIRecording = true;
          btn.style.background = '#da3633';
          btn.innerText = '停止';
          box.style.display = 'flex';
          text.innerText = '🎙️ 聆聽您的問題中...（講完請點擊停止）';
          qPreview.innerText = '';
          aPreview.style.display = 'none';
          closeBtn.style.display = 'none';
        };

        aiRecognition.onresult = (e) => {
          const resultText = e.results[0][0].transcript;
          if (resultText) {
            qPreview.innerText = `❓ 問題："${resultText}"`;
            text.innerText = '⏳ AI 正在思考回答...';
            
            db.ref(`rooms/${roomId}/ai_qna`).set({
              question: resultText,
              status: 'pending',
              timestamp: Date.now()
            });
          }
        };

        aiRecognition.onend = () => {
          isAIRecording = false;
          btn.style.background = '#21262d';
          btn.innerText = '發問';
          if (text.innerText === '🎙️ 聆聽您的問題中...（講完請點擊停止）') {
            text.innerText = '未偵測到您的語音問題，請重試。';
          }
        };

        aiRecognition.start();
      } else {
        if (aiRecognition) {
          aiRecognition.stop();
        }
      }
    }

    // 監聽 AI Q&A 同步狀態
    db.ref(`rooms/${roomId}/ai_qna`).on('value', (snapshot) => {
      const data = snapshot.val();
      const box = document.getElementById('aiStatusBox');
      const text = document.getElementById('aiStatusText');
      const qPreview = document.getElementById('aiQuestionPreview');
      const aPreview = document.getElementById('aiAnswerPreview');
      const closeBtn = document.getElementById('aiCloseBtn');

      if (data) {
        if (box) box.style.display = 'flex';
        if (qPreview) qPreview.innerText = `❓ 問題："${data.question}"`;
        
        if (data.status === 'pending') {
          if (text) text.innerText = '⏳ AI 正在思考回答...';
          if (aPreview) aPreview.style.display = 'none';
          if (closeBtn) closeBtn.style.display = 'none';
        } else if (data.status === 'replied') {
          if (text) text.innerText = '🙋 AI 已完成回答！是否關閉投影畫面以繼續上課？';
          if (aPreview) {
            aPreview.style.display = 'block';
            aPreview.innerText = `💡 回答：${data.answer}`;
          }
          if (closeBtn) {
            closeBtn.style.display = 'block';
            closeBtn.innerText = '關閉投影';
          }
        }
      } else {
        if (box) box.style.display = 'none';
      }
    });

    function closeAIQuestion() {
      db.ref(`rooms/${roomId}/ai_qna`).remove();
    }
  </script>
</body>
</html>
