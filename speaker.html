<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>講者麥克風控制台</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      background: #0d1117;
      color: #f0f6fc;
      padding: 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
    }
    h2 { margin-bottom: 10px; font-size: 1.5rem; }
    .room-badge {
      background: #21262d;
      border: 1px solid #30363d;
      padding: 6px 16px;
      border-radius: 20px;
      font-size: 0.9rem;
      color: #58a6ff;
      margin-bottom: 20px;
    }
    #toggleBtn {
      width: 100%;
      max-width: 300px;
      padding: 20px;
      font-size: 1.3rem;
      font-weight: bold;
      border: none;
      border-radius: 12px;
      background: #238636;
      color: #fff;
      cursor: pointer;
      box-shadow: 0 4px 12px rgba(35, 134, 54, 0.4);
      transition: all 0.2s ease;
    }
    #toggleBtn.speaking {
      background: #da3633;
      box-shadow: 0 4px 12px rgba(218, 54, 51, 0.4);
    }
    #status { margin-top: 15px; color: #8b949e; font-size: 0.95rem; }
    #preview-card {
      width: 100%;
      max-width: 400px;
      margin-top: 25px;
      background: #161b22;
      border: 1px solid #30363d;
      border-radius: 8px;
      padding: 15px;
      text-align: left;
    }
    #preview-card h3 { font-size: 0.9rem; color: #8b949e; margin-bottom: 8px; }
    #preview { font-size: 1.1rem; color: #e6edf3; line-height: 1.5; min-height: 60px; }
  </style>
</head>
<body>

  <h2>🎤 講者麥克風控制台</h2>
  <div class="room-badge">頻道號碼：<span id="room-id-display">----</span></div>

  <button id="toggleBtn">開啟麥克風收音</button>
  <p id="status">狀態：待命</p>

  <div id="preview-card">
    <h3>即時辨識預覽 (發送至大電視)</h3>
    <div id="preview">點擊上方按鈕開始講話...</div>
  </div>

  <script>
    // 1. 初始化 Firebase (已填入你的 Realtime Database 網址)
    const firebaseConfig = {
      databaseURL: "https://test-speaker-cb3f5-default-rtdb.asia-southeast1.firebasedatabase.app"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // 2. 取得網址列中的房間號碼
    const urlParams = new URLSearchParams(window.location.search);
    const roomId = urlParams.get('room') || 'default';
    document.getElementById('room-id-display').innerText = roomId;

    // 3. 初始化 Web Speech API
    const toggleBtn = document.getElementById('toggleBtn');
    const status = document.getElementById('status');
    const preview = document.getElementById('preview');

    const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
    let recognition = null;
    let isListening = false;

    if (!SpeechRecognition) {
      alert("您的手機瀏覽器不支援 Web Speech API，請使用 Android Chrome 或 iOS Safari");
    } else {
      recognition = new SpeechRecognition();
      recognition.continuous = true;
      recognition.interimResults = true;
      recognition.lang = 'zh-TW';

      recognition.onstart = () => {
        isListening = true;
        status.innerText = "狀態：收音中 (講話即時同步至大螢幕)";
        toggleBtn.innerText = "停止麥克風收音";
        toggleBtn.classList.add('speaking');
      };

      recognition.onend = () => {
        if (isListening) {
          recognition.start();
        } else {
          status.innerText = "狀態：已停止";
          toggleBtn.innerText = "開啟麥克風收音";
          toggleBtn.classList.remove('speaking');
        }
      };

      recognition.onresult = (event) => {
        let interimTranscript = '';
        let finalTranscript = '';

        for (let i = event.resultIndex; i < event.results.length; ++i) {
          if (event.results[i].isFinal) {
            finalTranscript += event.results[i][0].transcript;
          } else {
            interimTranscript += event.results[i][0].transcript;
          }
        }

        const currentText = finalTranscript || interimTranscript;
        preview.innerText = currentText || "聽取中...";

        // 即時傳送至雲端房間
        db.ref(`rooms/${roomId}/speech_live`).set({
          text: currentText,
          isFinal: finalTranscript !== '',
          timestamp: Date.now()
        });

        // 句尾斷句後歸檔
        if (finalTranscript) {
          db.ref(`rooms/${roomId}/speech_history`).push({
            text: finalTranscript,
            timestamp: Date.now()
          });
        }
      };
    }

    toggleBtn.onclick = () => {
      if (!isListening) {
        recognition.start();
      } else {
        isListening = false;
        recognition.stop();
      }
    };
  </script>
</body>
</html>
